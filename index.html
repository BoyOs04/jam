<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#070b14">
    <meta name="description" content="Jam analog dan digital 3D dengan tampilan modern.">
    <title>Jam Analog & Digital 3D</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Doto:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #070b14;
            --bg-soft: #0c1220;
            --panel: rgba(16, 23, 38, 0.68);
            --panel-strong: rgba(11, 17, 29, 0.86);
            --line: rgba(255, 255, 255, 0.11);
            --line-strong: rgba(255, 255, 255, 0.2);
            --text: #f7f9fc;
            --muted: #9ca8bc;
            --accent: #72d6ff;
            --accent-2: #ad8cff;
            --danger: #ff677d;
            --success: #76f7b1;
            --clock-size: min(72vw, 360px);
            --ease: cubic-bezier(.22, 1, .36, 1);
        }

        * {
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
            color-scheme: dark;
        }

        body {
            min-height: 100svh;
            margin: 0;
            display: grid;
            place-items: center;
            overflow-x: hidden;
            overflow-y: auto;
            position: relative;
            isolation: isolate;
            padding: 22px;
            background:
                radial-gradient(circle at 50% 45%, rgba(55, 102, 161, 0.18), transparent 27%),
                radial-gradient(circle at 15% 10%, rgba(114, 214, 255, 0.08), transparent 30%),
                radial-gradient(circle at 85% 80%, rgba(173, 140, 255, 0.07), transparent 32%),
                linear-gradient(145deg, #050810 0%, #0a1020 48%, #05070e 100%);
            color: var(--text);
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        body::before,
        body::after {
            content: "";
            position: absolute;
            inset: -20%;
            z-index: -3;
            pointer-events: none;
        }

        body::before {
            background:
                linear-gradient(rgba(255,255,255,0.018) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.018) 1px, transparent 1px);
            background-size: 46px 46px;
            mask-image: radial-gradient(circle at center, black 18%, transparent 75%);
            transform: perspective(700px) rotateX(67deg) translateY(18%);
            transform-origin: center bottom;
            opacity: .7;
        }

        body::after {
            background: radial-gradient(circle at center, rgba(114,214,255,.14), transparent 18%);
            filter: blur(50px);
            animation: ambientPulse 7s ease-in-out infinite;
        }

        button,
        [role="switch"] {
            font: inherit;
        }

        .app {
            width: min(100%, 980px);
            min-height: min(92svh, 760px);
            display: grid;
            place-items: center;
            position: relative;
            padding: clamp(18px, 4vw, 38px);
        }

        .hud {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .hud__line {
            position: absolute;
            background: linear-gradient(90deg, transparent, rgba(114,214,255,.35), transparent);
            opacity: .55;
        }

        .hud__line--top {
            top: 5%;
            left: 9%;
            right: 9%;
            height: 1px;
        }

        .hud__line--bottom {
            bottom: 5%;
            left: 16%;
            right: 16%;
            height: 1px;
            opacity: .3;
        }

        .hud__corner {
            position: absolute;
            width: 24px;
            height: 24px;
            opacity: .5;
        }

        .hud__corner::before,
        .hud__corner::after {
            content: "";
            position: absolute;
            background: var(--accent);
        }

        .hud__corner::before {
            width: 24px;
            height: 1px;
        }

        .hud__corner::after {
            width: 1px;
            height: 24px;
        }

        .hud__corner--tl { top: 5%; left: 6%; }
        .hud__corner--tr { top: 5%; right: 6%; transform: rotate(90deg); }
        .hud__corner--bl { bottom: 5%; left: 12%; transform: rotate(-90deg); }
        .hud__corner--br { bottom: 5%; right: 12%; transform: rotate(180deg); }

        .content {
            width: min(100%, 680px);
            display: grid;
            justify-items: center;
            gap: 13px;
            text-align: center;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            padding: 8px 12px;
            border: 1px solid var(--line);
            border-radius: 999px;
            background: rgba(12, 18, 31, .6);
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,.05),
                0 12px 36px rgba(0,0,0,.18);
            backdrop-filter: blur(18px);
            color: var(--muted);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .17em;
            text-transform: uppercase;
        }

        .eyebrow__dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--success);
            box-shadow: 0 0 12px var(--success);
            animation: statusBlink 2s ease-in-out infinite;
        }

        .judul {
            margin: 0;
            font-family: Doto, monospace;
            font-size: clamp(28px, 6vw, 52px);
            line-height: 1;
            font-weight: 800;
            letter-spacing: -.035em;
            text-wrap: balance;
            text-shadow:
                0 0 30px rgba(114,214,255,.1),
                0 10px 40px rgba(0,0,0,.35);
        }

        .subline {
            margin: 0;
            color: var(--muted);
            font-size: clamp(12px, 2.6vw, 14px);
            letter-spacing: .08em;
            text-transform: uppercase;
        }

        .clock-meta {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 2px;
        }

        .zone-time,
        .date-time {
            min-height: 30px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 7px 11px;
            border: 1px solid var(--line);
            border-radius: 999px;
            background: rgba(12, 18, 31, .62);
            box-shadow: inset 0 1px 0 rgba(255,255,255,.04);
            color: var(--muted);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .09em;
            backdrop-filter: blur(14px);
        }

        .zone-time {
            color: var(--accent);
        }

        .clock-stage {
            width: min(88vw, 480px);
            height: min(88vw, 480px);
            display: grid;
            place-items: center;
            perspective: 1200px;
            position: relative;
            margin: clamp(4px, 1vw, 10px) 0;
        }

        .clock-stage::before {
            content: "";
            position: absolute;
            width: 70%;
            height: 18%;
            bottom: 4%;
            border-radius: 50%;
            background: rgba(0,0,0,.55);
            filter: blur(24px);
            transform: translateZ(-140px) scaleX(1.1);
        }

        .clock-aura {
            position: absolute;
            width: 88%;
            height: 88%;
            border-radius: 50%;
            background:
                radial-gradient(circle at 34% 22%, rgba(255,255,255,.18), transparent 13%),
                radial-gradient(circle at 50% 50%, rgba(114,214,255,.12), transparent 45%),
                radial-gradient(circle, rgba(114,214,255,.14), transparent 65%);
            filter: blur(18px);
            transform: translateZ(-100px);
            opacity: .9;
        }

        .clock-shell {
            position: relative;
            width: var(--clock-size);
            height: var(--clock-size);
            transform-style: preserve-3d;
            transform: rotateX(8deg) rotateY(-8deg);
            transition: transform .55s var(--ease);
        }

        .clock-shell::before {
            content: "";
            position: absolute;
            inset: -10px;
            border-radius: 50%;
            background: linear-gradient(145deg, #485063 0%, #131a28 30%, #080c15 65%, #252d3d 100%);
            box-shadow:
                0 34px 50px rgba(0,0,0,.45),
                0 0 0 2px rgba(255,255,255,.05),
                inset 7px 7px 16px rgba(255,255,255,.12),
                inset -8px -10px 20px rgba(0,0,0,.45);
            transform: translateZ(-42px);
        }

        .clock-shell::after {
            content: "";
            position: absolute;
            inset: -2px;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,.13);
            box-shadow:
                0 0 0 7px rgba(114,214,255,.035),
                0 0 35px rgba(114,214,255,.12);
            transform: translateZ(-20px);
            pointer-events: none;
        }

        .clock {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            overflow: hidden;
            isolation: isolate;
            background:
                radial-gradient(circle at 32% 20%, rgba(255,255,255,.13), transparent 18%),
                radial-gradient(circle at 50% 55%, rgba(42,68,91,.16), transparent 38%),
                linear-gradient(145deg, #1e293b 0%, #0b111d 58%, #050812 100%);
            border: 1px solid rgba(255,255,255,.13);
            box-shadow:
                inset 0 3px 4px rgba(255,255,255,.08),
                inset 0 -20px 35px rgba(0,0,0,.38),
                inset 5px 0 28px rgba(0,0,0,.25),
                0 0 0 1px rgba(0,0,0,.5);
            transform-style: preserve-3d;
        }

        .clock::before {
            content: "";
            position: absolute;
            inset: 1.3%;
            z-index: 0;
            border-radius: inherit;
            border: 1px solid rgba(255,255,255,.075);
            background:
                repeating-conic-gradient(
                    from 0deg,
                    rgba(255,255,255,.32) 0deg .45deg,
                    transparent .45deg 30deg
                );
            mask-image: radial-gradient(circle, transparent 0 69%, black 69.5% 100%);
            opacity: .72;
        }

        .clock::after {
            content: "";
            position: absolute;
            inset: 0;
            z-index: 9;
            pointer-events: none;
            background:
                linear-gradient(
                    116deg,
                    rgba(255,255,255,.19) 0%,
                    rgba(255,255,255,.06) 20%,
                    transparent 29%,
                    transparent 70%,
                    rgba(114,214,255,.07) 82%,
                    transparent 92%
                );
            mix-blend-mode: screen;
        }

        .ticks {
            position: absolute;
            inset: 0;
            z-index: 1;
            border-radius: 50%;
            transform: translateZ(11px);
            pointer-events: none;
        }

        .tick {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 2px;
            height: 7px;
            border-radius: 2px;
            background: rgba(230,239,249,.52);
            transform-origin: 0 0;
            box-shadow: 0 0 7px rgba(114,214,255,.1);
        }

        .tick--major {
            width: 3px;
            height: 13px;
            background: rgba(246,250,255,.9);
            box-shadow: 0 0 10px rgba(114,214,255,.18);
        }

        .numerals {
            position: absolute;
            inset: 0;
            z-index: 2;
            transform: translateZ(15px);
            pointer-events: none;
        }

        .numeral {
            position: absolute;
            width: 30px;
            height: 30px;
            display: grid;
            place-items: center;
            margin: -15px 0 0 -15px;
            color: #dfe7f3;
            font-family: Doto, monospace;
            font-size: clamp(12px, 2.6vw, 17px);
            font-weight: 800;
            text-shadow: 0 2px 10px rgba(0,0,0,.4);
        }

        .dial-label {
            position: absolute;
            z-index: 2;
            top: 26%;
            left: 50%;
            transform: translateX(-50%) translateZ(14px);
            color: rgba(212,225,240,.62);
            font-family: Doto, monospace;
            font-size: 9px;
            font-weight: 700;
            letter-spacing: .2em;
            text-transform: uppercase;
            pointer-events: none;
        }

        .hand {
            position: absolute;
            left: 50%;
            bottom: 50%;
            z-index: 5;
            transform-origin: 50% 100%;
            transform-style: preserve-3d;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 0;
            border-radius: 999px;
            will-change: transform;
        }

        .hand::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            transform: translateZ(-3px);
            filter: blur(1px);
            opacity: .45;
            background: #000;
        }

        .hour {
            width: 8px;
            height: 27%;
            margin-left: -4px;
            background: linear-gradient(180deg, #f8fbff 0%, #c5cfdd 70%, #8a96aa 100%);
            box-shadow:
                0 0 10px rgba(255,255,255,.14),
                1px 3px 8px rgba(0,0,0,.45);
        }

        .minute {
            width: 5px;
            height: 36%;
            margin-left: -2.5px;
            background: linear-gradient(180deg, #e9f5ff 0%, #97d9f6 70%, #4a7188 100%);
            box-shadow:
                0 0 12px rgba(114,214,255,.22),
                1px 3px 8px rgba(0,0,0,.5);
        }

        .second {
            width: 2px;
            height: 41%;
            margin-left: -1px;
            background: linear-gradient(180deg, #ff7186 0%, #ff516a 70%, #c62944 100%);
            box-shadow:
                0 0 14px rgba(255,103,125,.45),
                1px 2px 8px rgba(0,0,0,.52);
        }

        .second::before {
            content: "";
            position: absolute;
            top: 0;
            left: 50%;
            width: 8px;
            height: 8px;
            margin: -4px 0 0 -4px;
            border-radius: 50%;
            background: #ff6b83;
            box-shadow: 0 0 14px rgba(255,103,125,.55);
        }

        .hand span {
            position: absolute;
            top: -18px;
            left: 50%;
            transform: translateX(-50%) translateZ(4px);
            color: rgba(255,255,255,.9);
            padding: 2px 5px;
            border: 1px solid rgba(255,255,255,.11);
            border-radius: 6px;
            background: rgba(4,7,13,.66);
            box-shadow: 0 5px 14px rgba(0,0,0,.25);
            font-family: Doto, monospace;
            font-size: 9px;
            font-weight: 800;
            letter-spacing: .04em;
            text-shadow: 0 0 8px currentColor;
            backdrop-filter: blur(9px);
        }

        .hour span { color: #f4f7fb; }
        .minute span { color: var(--accent); }
        .second span { color: #ff8092; }

        .center {
            position: absolute;
            top: 50%;
            left: 50%;
            z-index: 7;
            width: 20px;
            height: 20px;
            margin: -10px 0 0 -10px;
            border-radius: 50%;
            background:
                radial-gradient(circle at 35% 30%, #eaf7ff 0 13%, #8da5bb 22%, #253344 48%, #0a0f18 80%);
            border: 1px solid rgba(255,255,255,.18);
            box-shadow:
                0 0 0 4px rgba(114,214,255,.05),
                0 0 22px rgba(114,214,255,.2),
                inset 2px 2px 4px rgba(255,255,255,.18);
            transform: translateZ(28px);
        }

        .digital-wrap {
            position: absolute;
            left: 50%;
            bottom: 12.5%;
            z-index: 4;
            transform: translateX(-50%) translateZ(18px);
            display: grid;
            justify-items: center;
            gap: 3px;
        }

        .digital-time {
            color: #eef8ff;
            font-family: Doto, monospace;
            font-size: clamp(20px, 5vw, 30px);
            font-weight: 800;
            line-height: 1;
            letter-spacing: .06em;
            white-space: nowrap;
            text-shadow:
                0 0 12px rgba(114,214,255,.25),
                0 3px 12px rgba(0,0,0,.45);
        }

        .digital-zone {
            color: rgba(181,200,220,.62);
            font-size: 8px;
            letter-spacing: .18em;
            text-transform: uppercase;
        }

        .control-panel {
            width: min(100%, 370px);
            display: grid;
            gap: 10px;
            padding: 12px;
            border: 1px solid var(--line);
            border-radius: 20px;
            background: linear-gradient(180deg, rgba(16,23,38,.7), rgba(8,12,21,.72));
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,.05),
                0 20px 60px rgba(0,0,0,.24);
            backdrop-filter: blur(18px);
        }

        .control-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 2px 4px;
        }

        .control-title {
            color: rgba(220,229,240,.74);
            font-size: 10px;
            font-weight: 700;
            letter-spacing: .12em;
            text-transform: uppercase;
        }

        .control-hint {
            color: rgba(156,168,188,.65);
            font-size: 10px;
        }

        .slide-container {
            position: relative;
            width: 100%;
            height: 48px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            align-items: center;
            padding: 4px;
            border: 1px solid rgba(255,255,255,.08);
            border-radius: 15px;
            background: rgba(4,7,13,.55);
            cursor: pointer;
            user-select: none;
            outline: none;
            box-shadow: inset 0 2px 8px rgba(0,0,0,.22);
        }

        .slide-container:focus-visible {
            box-shadow:
                0 0 0 2px rgba(114,214,255,.55),
                inset 0 2px 8px rgba(0,0,0,.22);
        }

        .slide-button {
            position: absolute;
            left: 4px;
            top: 4px;
            width: calc(50% - 4px);
            height: calc(100% - 8px);
            border-radius: 11px;
            background: linear-gradient(135deg, rgba(114,214,255,.95), rgba(70,141,190,.92));
            box-shadow:
                0 4px 14px rgba(114,214,255,.22),
                inset 0 1px 0 rgba(255,255,255,.22);
            transition:
                transform .42s var(--ease),
                background .35s ease,
                box-shadow .35s ease;
        }

        .toggle-12-hour .slide-button {
            transform: translateX(100%);
            background: linear-gradient(135deg, rgba(173,140,255,.98), rgba(118,85,196,.94));
            box-shadow:
                0 4px 14px rgba(173,140,255,.22),
                inset 0 1px 0 rgba(255,255,255,.2);
        }

        .slide-label {
            position: relative;
            z-index: 1;
            display: grid;
            place-items: center;
            min-width: 0;
            height: 100%;
            color: rgba(209,219,233,.58);
            font-family: Doto, monospace;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: .04em;
            transition: color .35s ease;
        }

        .slide-label.left {
            color: #07111b;
        }

        .toggle-12-hour .slide-label.left {
            color: rgba(209,219,233,.58);
        }

        .toggle-12-hour .slide-label.right {
            color: #0f0a22;
        }

        .footer {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: rgba(156,168,188,.52);
            font-size: 9px;
            letter-spacing: .1em;
            text-transform: uppercase;
        }

        .footer__sep {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: rgba(114,214,255,.5);
        }

        .reduced-motion *,
        .reduced-motion *::before,
        .reduced-motion *::after {
            animation-duration: .001ms !important;
            animation-iteration-count: 1 !important;
            scroll-behavior: auto !important;
            transition-duration: .001ms !important;
        }

        @keyframes ambientPulse {
            0%, 100% { transform: scale(.92); opacity: .45; }
            50% { transform: scale(1.06); opacity: .9; }
        }

        @keyframes statusBlink {
            0%, 100% { opacity: 1; }
            50% { opacity: .45; }
        }

        @media (hover: hover) and (pointer: fine) {
            .clock-stage:hover .clock-shell {
                transform: rotateX(5deg) rotateY(5deg) translateY(-4px);
            }
        }

        @media (max-height: 760px) {
            .app {
                min-height: 100svh;
                padding-block: 8px;
            }

            .content {
                gap: 8px;
            }

            .clock-stage {
                width: min(72vw, 350px);
                height: min(72vw, 350px);
                margin: 0;
            }

            .control-panel {
                padding: 9px;
            }

            .slide-container {
                height: 42px;
            }

            .footer {
                display: none;
            }
        }

        @media (max-width: 420px) {
            body {
                padding: 10px;
            }

            .app {
                padding: 12px;
            }

            .clock-stage {
                width: min(86vw, 330px);
                height: min(86vw, 330px);
            }

            .clock-meta {
                gap: 6px;
            }

            .zone-time,
            .date-time {
                min-height: 27px;
                padding: 6px 9px;
                font-size: 9px;
            }

            .digital-time {
                font-size: clamp(18px, 5.7vw, 25px);
            }

            .control-panel {
                border-radius: 16px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            body {
                scroll-behavior: auto;
            }

            body::after,
            .eyebrow__dot {
                animation: none;
            }
        }
    
        /* ===== Floating utility HUD ===== */
        .utility-hud{position:fixed;top:14px;right:14px;z-index:50;display:flex;align-items:center;gap:8px;pointer-events:none}
        .floating-card{display:inline-flex;align-items:center;gap:8px;min-height:34px;padding:7px 10px;border:1px solid rgba(255,255,255,.1);border-radius:11px;background:rgba(8,12,21,.72);box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 12px 35px rgba(0,0,0,.25);backdrop-filter:blur(16px);color:rgba(222,232,245,.72);font-size:10px;font-weight:700;letter-spacing:.07em}
        .fps-card{font-family:Doto,monospace}.fps-value{min-width:42px;text-align:right;color:var(--success)}
        .effects-toggle{pointer-events:auto;display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 10px;border:1px solid rgba(255,255,255,.1);border-radius:11px;background:rgba(8,12,21,.72);color:rgba(222,232,245,.78);cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 12px 35px rgba(0,0,0,.25);backdrop-filter:blur(16px)}
        .effects-toggle:hover{border-color:rgba(114,214,255,.32);color:#fff}.effects-toggle:focus-visible{outline:2px solid rgba(114,214,255,.65);outline-offset:2px}
        .effects-toggle__dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px rgba(114,214,255,.65)}
        .effects-off .effects-toggle__dot{background:#6c7689;box-shadow:none}
        /* ===== Main timezone selector ===== */
        .timezone-picker{display:inline-flex;align-items:center;gap:7px;min-height:30px;max-width:min(92vw,340px);padding:0 9px;border:1px solid var(--line);border-radius:999px;background:rgba(12,18,31,.62);backdrop-filter:blur(14px)}
        .timezone-picker__label{color:rgba(156,168,188,.7);font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
        .timezone-select,.compare-select{min-width:0;border:0;outline:0;background:transparent;color:#dce8f5;font:700 10px Inter,system-ui,sans-serif;cursor:pointer}
        .timezone-select{width:210px}
        .compare-select{width:100%;min-height:36px;padding:0 34px 0 10px;border:1px solid rgba(255,255,255,.08);border-radius:10px;appearance:none;background:linear-gradient(45deg,transparent 50%,rgba(220,232,245,.65) 50%) calc(100% - 14px) 16px/5px 5px no-repeat,linear-gradient(135deg,rgba(220,232,245,.65) 50%,transparent 50%) calc(100% - 10px) 16px/5px 5px no-repeat,rgba(4,7,13,.5)}
        .timezone-select option,.compare-select option{color:#eaf2fc;background:#0c1220}
        /* ===== World time comparison ===== */
        .compare-panel{width:min(100%,680px);display:none;gap:12px;padding:14px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(180deg,rgba(16,23,38,.72),rgba(8,12,21,.76));box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 20px 60px rgba(0,0,0,.22);backdrop-filter:blur(18px);text-align:left}
        .compare-panel.is-open{display:grid;animation:panelIn .4s var(--ease)}
        .compare-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.compare-title-wrap{display:grid;gap:3px}
        .compare-title{color:rgba(229,237,247,.9);font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.compare-subtitle{color:rgba(156,168,188,.62);font-size:9px}
        .compare-add,.compare-open-button{pointer-events:auto;border:1px solid rgba(114,214,255,.18);border-radius:10px;padding:7px 10px;background:rgba(114,214,255,.07);color:var(--accent);cursor:pointer;font-size:10px;font-weight:800;letter-spacing:.05em}
        .compare-add:hover,.compare-open-button:hover{background:rgba(114,214,255,.12);border-color:rgba(114,214,255,.35)}.compare-open-button{width:100%;min-height:38px;text-transform:uppercase}
        .compare-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
        .compare-card{position:relative;overflow:hidden;min-width:0;padding:12px;border:1px solid rgba(255,255,255,.08);border-radius:15px;background:radial-gradient(circle at 75% 15%,rgba(114,214,255,.08),transparent 28%),rgba(4,7,13,.42)}
        .compare-card::before{content:"";position:absolute;left:-20%;right:-20%;top:0;height:1px;background:linear-gradient(90deg,transparent,rgba(114,214,255,.35),transparent)}
        .compare-card__top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:8px}.compare-card__name{display:grid;gap:3px}
        .compare-card__city{color:#e8f1fb;font-size:11px;font-weight:800}.compare-card__zone{color:rgba(156,168,188,.62);font-size:8px;letter-spacing:.08em}
        .compare-remove{width:24px;height:24px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.07);border-radius:7px;background:rgba(255,255,255,.035);color:rgba(210,220,235,.55);cursor:pointer}
        .compare-remove:hover{color:#ff8092;border-color:rgba(255,103,125,.24)}
        .compare-time{margin:11px 0 5px;color:#eef8ff;font-family:Doto,monospace;font-size:clamp(22px,5vw,30px);font-weight:800;line-height:1;letter-spacing:.04em;white-space:nowrap;text-shadow:0 0 14px rgba(114,214,255,.15)}
        .compare-date{color:rgba(181,200,220,.58);font-size:9px}.compare-offset{margin-top:9px;display:inline-flex;padding:5px 7px;border:1px solid rgba(114,214,255,.1);border-radius:999px;color:rgba(114,214,255,.8);background:rgba(114,214,255,.045);font-size:8px;font-weight:800;letter-spacing:.08em}
        .compare-open-button:focus-visible,.compare-add:focus-visible,.compare-remove:focus-visible{outline:2px solid rgba(114,214,255,.65);outline-offset:2px}
        .effects-off::before,.effects-off::after,.effects-off .clock-aura,.effects-off .eyebrow__dot{animation:none!important}
        .effects-off .clock-aura,.effects-off .clock-shell::after,.effects-off .second,.effects-off .center{box-shadow:none!important}.effects-off .clock-stage::before{filter:blur(8px);opacity:.45}.effects-off .clock-shell{transform:none!important}.effects-off .clock::after{opacity:.18}
        @keyframes panelIn{from{opacity:0;transform:translateY(-7px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}
        @media(max-width:620px){.utility-hud{top:8px;right:8px}.floating-card{min-height:30px;padding:6px 8px;font-size:8px}.effects-toggle{height:30px;padding:0 8px;font-size:8px}.timezone-picker{width:min(92vw,340px)}.timezone-select{flex:1;width:auto}.compare-grid{grid-template-columns:1fr}}

    </style>
</head>
<body>

        <div class="utility-hud" aria-label="Utility controls">
            <div class="floating-card fps-card" title="Frame rate"><span>FPS</span><strong class="fps-value" id="fps-value">--</strong></div>
            <button class="effects-toggle" id="effects-toggle" type="button" aria-pressed="true" title="Enable atau disable efek visual">
                <span class="effects-toggle__dot" aria-hidden="true"></span><span id="effects-label">FX ON</span>
            </button>
        </div>

    <main class="app">
        <div class="hud" aria-hidden="true">
            <span class="hud__line hud__line--top"></span>
            <span class="hud__line hud__line--bottom"></span>
            <span class="hud__corner hud__corner--tl"></span>
            <span class="hud__corner hud__corner--tr"></span>
            <span class="hud__corner hud__corner--bl"></span>
            <span class="hud__corner hud__corner--br"></span>
        </div>

        <section class="content" aria-label="Jam analog dan digital">
            <div class="eyebrow">
                <span class="eyebrow__dot" aria-hidden="true"></span>
                Live time system
            </div>

            <h1 class="judul">Jam Analog &amp; Digital</h1>
            <p class="subline">Precision time interface · 3D glass dial</p>

            <div class="clock-meta">
                <div class="zone-time" id="timezone">UTC</div>

                <div class="timezone-picker" title="Pilih zona waktu utama">
                    <span class="timezone-picker__label">Zone</span>
                    <select class="timezone-select" id="main-timezone" aria-label="Zona waktu utama"></select>
                </div>

                <div class="date-time" id="date-time">-- · -- --- ----</div>
            </div>

            <div class="clock-stage">
                <div class="clock-aura" aria-hidden="true"></div>

                <div class="clock-shell">
                    <div class="clock" id="clock">
                        <div class="ticks" id="ticks" aria-hidden="true"></div>
                        <div class="numerals" id="numerals" aria-hidden="true"></div>
                        <div class="dial-label">precision / local</div>

                        <div class="hand hour" id="hour" aria-label="Jarum jam">
                            <span></span>
                        </div>

                        <div class="hand minute" id="minute" aria-label="Jarum menit">
                            <span></span>
                        </div>

                        <div class="hand second" id="second" aria-label="Jarum detik">
                            <span></span>
                        </div>

                        <div class="digital-wrap">
                            <div class="digital-time" id="digital-time">00:00:00</div>
                            <div class="digital-zone" id="digital-zone">LOCAL TIME</div>
                        </div>

                        <div class="center" aria-hidden="true"></div>
                    </div>
                </div>
            </div>

            <div class="control-panel">
                <div class="control-head">
                    <span class="control-title">Display format</span>
                    <span class="control-hint" id="format-hint">24-hour</span>
                </div>

                <div
                    class="slide-container"
                    id="slide-container"
                    role="switch"
                    aria-checked="false"
                    tabindex="0"
                    aria-label="Ganti format waktu antara 24 jam dan 12 jam"
                >
                    <div class="slide-button" aria-hidden="true"></div>
                    <div class="slide-label left">24-Hour</div>
                    <div class="slide-label right">12-Hour</div>
                </div>
            </div>


            <section class="compare-panel" id="compare-panel" aria-label="Perbandingan waktu dunia">
                <div class="compare-head">
                    <div class="compare-title-wrap">
                        <div class="compare-title">World Time Compare</div>
                        <div class="compare-subtitle">Bandingkan dua atau lebih lokasi secara real-time</div>
                    </div>
                    <button class="compare-add" id="compare-add" type="button">+ Add location</button>
                </div>
                <div class="compare-grid" id="compare-grid"></div>
            </section>


            <div class="footer">
                <span id="sync-status">SYNCED</span>
                <span class="footer__sep" aria-hidden="true"></span>
                <span>ANALOG / DIGITAL</span>
            </div>
        </section>
    </main>

    <script>
        "use strict";

        const hourHand = document.getElementById("hour");
        const minuteHand = document.getElementById("minute");
        const secondHand = document.getElementById("second");
        const digitalTime = document.getElementById("digital-time");
        const digitalZone = document.getElementById("digital-zone");
        const timezoneElement = document.getElementById("timezone");
        const dateTimeElement = document.getElementById("date-time");
        const slideContainer = document.getElementById("slide-container");
        const formatHint = document.getElementById("format-hint");
        const syncStatus = document.getElementById("sync-status");
        const ticks = document.getElementById("ticks");
        const numerals = document.getElementById("numerals");

        const state = {
            is12HourFormat: false,
            baseTimeMs: Date.now(),
            syncPerfMs: performance.now(),
            synced: false,
            lastSecond: -1
        };

        const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

        if (reducedMotion) {
            document.body.classList.add("reduced-motion");
        }

        /**
         * Create dial markers without hard-coding 60 elements in the HTML.
         */
        function buildDial() {
            const fragment = document.createDocumentFragment();

            for (let index = 0; index < 60; index += 1) {
                const tick = document.createElement("span");
                const angle = index * 6;
                const isMajor = index % 5 === 0;

                tick.className = isMajor ? "tick tick--major" : "tick";
                tick.style.transform = `rotate(${angle}deg) translateY(calc(var(--clock-size) * -0.445))`;
                fragment.appendChild(tick);
            }

            ticks.appendChild(fragment);

            const numeralsFragment = document.createDocumentFragment();

            for (let number = 1; number <= 12; number += 1) {
                const numeral = document.createElement("span");
                const angle = number * 30;
                const radius = 39.5;
                const radians = (angle - 90) * (Math.PI / 180);
                const x = 50 + Math.cos(radians) * radius;
                const y = 50 + Math.sin(radians) * radius;

                numeral.className = "numeral";
                numeral.textContent = String(number);
                numeral.style.left = `${x}%`;
                numeral.style.top = `${y}%`;
                numeralsFragment.appendChild(numeral);
            }

            numerals.appendChild(numeralsFragment);
        }

        /**
         * Read a server timestamp once, then keep time locally between syncs.
         * This avoids a network request every second and still preserves the
         * original Cloudflare-based source when available.
         */

        /**
         * Return the current clock time using the last synchronized epoch.
         * performance.now() is monotonic, so the clock keeps advancing after sync.
         */
        function getCurrentDate() {
            return new Date(
                state.baseTimeMs + (performance.now() - state.syncPerfMs)
            );
        }

        async function synchronizeTime() {
            try {
                const response = await fetch("https://www.cloudflare.com/cdn-cgi/trace", {
                    cache: "no-store",
                    mode: "cors"
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const data = await response.text();
                const timestampLine = data
                    .split("\n")
                    .find((line) => line.startsWith("ts="));

                const timestamp = Number.parseFloat(timestampLine?.split("=")[1]);

                if (!Number.isFinite(timestamp)) {
                    throw new Error("Invalid timestamp response");
                }

                state.baseTimeMs = timestamp * 1000;
                state.syncPerfMs = performance.now();
                state.synced = true;
                syncStatus.textContent = "SYNCED";
            } catch (error) {
                state.baseTimeMs = Date.now();
                state.syncPerfMs = performance.now();
                state.synced = false;
                syncStatus.textContent = "LOCAL FALLBACK";
                console.warn("Time sync failed; using local clock.", error);
            }
        }


        const mainTimezone = document.getElementById("main-timezone");
        const compareOpenButton = document.getElementById("compare-open-button");
        const comparePanel = document.getElementById("compare-panel");
        const compareAddButton = document.getElementById("compare-add");
        const compareGrid = document.getElementById("compare-grid");
        const fpsValue = document.getElementById("fps-value");
        const effectsToggle = document.getElementById("effects-toggle");
        const effectsLabel = document.getElementById("effects-label");

        const TIME_ZONES = [
            { zone:"local", label:"Auto · Browser", city:"Local" },
            { zone:"UTC", label:"GMT · UTC+0", city:"Greenwich / UTC" },
            { zone:"Asia/Jakarta", label:"WIB · UTC+7", city:"Jakarta" },
            { zone:"Asia/Makassar", label:"WITA · UTC+8", city:"Makassar" },
            { zone:"Asia/Jayapura", label:"WIT · UTC+9", city:"Jayapura" },
            { zone:"Asia/Singapore", label:"SGT · UTC+8", city:"Singapore" },
            { zone:"Asia/Tokyo", label:"JST · UTC+9", city:"Tokyo" },
            { zone:"Asia/Seoul", label:"KST · UTC+9", city:"Seoul" },
            { zone:"Asia/Shanghai", label:"China Standard · UTC+8", city:"Shanghai" },
            { zone:"Asia/Kolkata", label:"IST · UTC+5:30", city:"Kolkata" },
            { zone:"Asia/Dubai", label:"GST · UTC+4", city:"Dubai" },
            { zone:"Asia/Riyadh", label:"AST · UTC+3", city:"Riyadh" },
            { zone:"Europe/London", label:"GMT / BST", city:"London" },
            { zone:"Europe/Berlin", label:"CET / CEST", city:"Berlin" },
            { zone:"Europe/Moscow", label:"MSK · UTC+3", city:"Moscow" },
            { zone:"America/New_York", label:"ET · EST / EDT", city:"New York" },
            { zone:"America/Chicago", label:"CT · CST / CDT", city:"Chicago" },
            { zone:"America/Denver", label:"MT · MST / MDT", city:"Denver" },
            { zone:"America/Los_Angeles", label:"PT · PST / PDT", city:"Los Angeles" },
            { zone:"America/Sao_Paulo", label:"BRT · UTC-3", city:"São Paulo" },
            { zone:"Pacific/Honolulu", label:"HST · UTC-10", city:"Honolulu" },
            { zone:"Australia/Sydney", label:"AEST / AEDT", city:"Sydney" },
            { zone:"Pacific/Auckland", label:"NZST / NZDT", city:"Auckland" }
        ];

        const TIMEZONE_BY_ZONE = new Map(TIME_ZONES.map((item) => [item.zone, item]));
        const compareState = { zones:["Asia/Jakarta", "Asia/Makassar"] };

        function getTimeZone() {
            return mainTimezone.value === "local"
                ? Intl.DateTimeFormat().resolvedOptions().timeZone
                : mainTimezone.value;
        }

        function getZonedParts(date, timeZone) {
            const parts = new Intl.DateTimeFormat("en-US", {
                timeZone:timeZone, hourCycle:"h23", year:"numeric", month:"2-digit",
                day:"2-digit", hour:"2-digit", minute:"2-digit", second:"2-digit"
            }).formatToParts(date);
            const values = {};
            for (const part of parts) {
                if (part.type !== "literal") values[part.type] = Number(part.value);
            }
            return values;
        }

        function getOffsetLabel(date, timeZone) {
            return new Intl.DateTimeFormat("en-US", {
                timeZone:timeZone, timeZoneName:"shortOffset"
            }).formatToParts(date).find((part) => part.type === "timeZoneName")?.value || "GMT";
        }

        function getAbbreviation(date, timeZone) {
            const custom = {
                "Asia/Jakarta":"WIB", "Asia/Makassar":"WITA", "Asia/Jayapura":"WIT",
                "Asia/Tokyo":"JST", "Asia/Seoul":"KST", "Asia/Singapore":"SGT",
                "Asia/Shanghai":"CST", "Asia/Kolkata":"IST", "Asia/Dubai":"GST",
                "Asia/Riyadh":"AST", "Europe/Moscow":"MSK", "America/Sao_Paulo":"BRT",
                "Pacific/Honolulu":"HST", "UTC":"GMT"
            };
            if (custom[timeZone]) return custom[timeZone];

            return new Intl.DateTimeFormat("en-US", {
                timeZone:timeZone, timeZoneName:"short"
            }).formatToParts(date).find((part) => part.type === "timeZoneName")?.value || getOffsetLabel(date, timeZone);
        }

        function populateTimezoneSelect(select) {
            const fragment = document.createDocumentFragment();
            for (const item of TIME_ZONES) {
                const option = document.createElement("option");
                option.value = item.zone;
                option.textContent = item.label;
                fragment.appendChild(option);
            }
            select.replaceChildren(fragment);
        }

        function updateMainTimeZone(date) {
            const timeZone = getTimeZone();
            const parts = getZonedParts(date, timeZone);
            const hour24 = parts.hour;
            const minute = parts.minute;
            const second = parts.second;
            const displayHour = state.is12HourFormat ? (hour24 % 12 || 12) : hour24;
            const h = String(displayHour).padStart(2, "0");
            const m = String(minute).padStart(2, "0");
            const s = String(second).padStart(2, "0");

            digitalTime.textContent = state.is12HourFormat
                ? h + ":" + m + ":" + s + " " + (hour24 >= 12 ? "PM" : "AM")
                : h + ":" + m + ":" + s;

            digitalZone.textContent = getAbbreviation(date, timeZone) + " · " + (state.is12HourFormat ? "12H" : "24H");
            timezoneElement.textContent = getAbbreviation(date, timeZone) + " · " + getOffsetLabel(date, timeZone);
            hourHand.querySelector("span").textContent = h;
            minuteHand.querySelector("span").textContent = m;
            secondHand.querySelector("span").textContent = s;

            dateTimeElement.textContent = new Intl.DateTimeFormat("id-ID", {
                timeZone:timeZone, weekday:"short", day:"2-digit", month:"short", year:"numeric"
            }).format(date);

            formatHint.textContent = state.is12HourFormat ? "12-hour" : "24-hour";
            slideContainer.classList.toggle("toggle-12-hour", state.is12HourFormat);
            slideContainer.setAttribute("aria-checked", String(state.is12HourFormat));
        }

        function updateMainHands(date) {
            const timeZone = getTimeZone();
            const parts = getZonedParts(date, timeZone);
            const seconds = parts.second + date.getMilliseconds() / 1000;
            const minutes = parts.minute + seconds / 60;
            const hours = parts.hour + minutes / 60;
            const hourDegrees = (hours % 12) * 30;
            const minuteDegrees = minutes * 6;
            const secondDegrees = seconds * 6;

            hourHand.style.transform = "rotate(" + hourDegrees + "deg) translateZ(20px)";
            minuteHand.style.transform = "rotate(" + minuteDegrees + "deg) translateZ(21px)";
            secondHand.style.transform = "rotate(" + secondDegrees + "deg) translateZ(22px)";
        }

        function renderCompareCard(zone, index, date) {
            const info = TIMEZONE_BY_ZONE.get(zone) || {
                label:zone,
                city:zone.split("/").pop()?.replaceAll("_", " ") || zone
            };

            const time = new Intl.DateTimeFormat("id-ID", {
                timeZone:zone, hour:"2-digit", minute:"2-digit", second:"2-digit", hourCycle:"h23"
            }).format(date);

            const dateLabel = new Intl.DateTimeFormat("id-ID", {
                timeZone:zone, weekday:"short", day:"2-digit", month:"short", year:"numeric"
            }).format(date);

            const options = TIME_ZONES
                .filter((item) => item.zone !== "local")
                .map((item) =>
                    '<option value="' + item.zone + '"' +
                    (item.zone === zone ? " selected" : "") + ">" +
                    item.city + " — " + item.label + "</option>"
                )
                .join("");

            return (
                '<article class="compare-card">' +
                    '<div class="compare-card__top">' +
                        '<div class="compare-card__name">' +
                            '<strong class="compare-card__city">' + info.city + "</strong>" +
                            '<span class="compare-card__zone">' + info.label + "</span>" +
                        "</div>" +
                        '<button class="compare-remove" type="button" data-remove-index="' + index + '" aria-label="Hapus ' + info.city + '" title="Hapus lokasi">×</button>' +
                    "</div>" +
                    '<select class="compare-select" data-zone-index="' + index + '" aria-label="Pilih lokasi jam ' + (index + 1) + '">' +
                        options +
                    "</select>" +
                    '<div class="compare-time">' + time + "</div>" +
                    '<div class="compare-date">' + dateLabel + "</div>" +
                    '<span class="compare-offset">' + getAbbreviation(date, zone) + " · " + getOffsetLabel(date, zone) + "</span>" +
                "</article>"
            );
        }

        function renderComparison(date) {
            const currentDate = date || getCurrentDate();

            compareGrid.innerHTML = compareState.zones
                .map((zone, index) => renderCompareCard(zone, index, currentDate))
                .join("");

            compareGrid.querySelectorAll("[data-zone-index]").forEach((select) => {
                select.addEventListener("change", (event) => {
                    const index = Number(event.currentTarget.dataset.zoneIndex);
                    compareState.zones[index] = event.currentTarget.value;
                    renderComparison(getCurrentDate());
                });
            });

            compareGrid.querySelectorAll("[data-remove-index]").forEach((button) => {
                button.addEventListener("click", (event) => {
                    const index = Number(event.currentTarget.dataset.removeIndex);
                    if (compareState.zones.length <= 2) return;
                    compareState.zones.splice(index, 1);
                    renderComparison(getCurrentDate());
                });
            });
        }

        function openComparison() {
            comparePanel.classList.toggle("is-open");
            const isOpen = comparePanel.classList.contains("is-open");

            compareOpenButton.setAttribute("aria-expanded", String(isOpen));
            compareOpenButton.textContent = isOpen ? "Hide Comparison" : "Compare 2 Clocks";

            if (isOpen) renderComparison(getCurrentDate());
        }

        function addComparisonLocation() {
            if (compareState.zones.length >= 6) return;

            const next = TIME_ZONES
                .filter((item) => item.zone !== "local")
                .map((item) => item.zone)
                .find((zone) => !compareState.zones.includes(zone));

            if (next) {
                compareState.zones.push(next);
                renderComparison(getCurrentDate());
            }
        }

        function initializeTimeZones() {
            populateTimezoneSelect(mainTimezone);
            mainTimezone.value = "local";

            mainTimezone.addEventListener("change", () => {
                state.lastSecond = -1;
                updateMainTimeZone(getCurrentDate());
            });
        }

        function updateEffectsState(enabled) {
            document.body.classList.toggle("effects-off", !enabled);
            effectsToggle.setAttribute("aria-pressed", String(enabled));
            effectsLabel.textContent = enabled ? "FX ON" : "FX OFF";

            try {
                localStorage.setItem("clock-effects", enabled ? "on" : "off");
            } catch {
                // Ignore storage restrictions.
            }
        }

        function initializeEffects() {
            let enabled = true;

            try {
                enabled = localStorage.getItem("clock-effects") !== "off";
            } catch {
                // Keep effects enabled when storage is unavailable.
            }

            updateEffectsState(enabled);

            effectsToggle.addEventListener("click", () => {
                const enabledNow = effectsToggle.getAttribute("aria-pressed") === "true";
                updateEffectsState(!enabledNow);
            });
        }

        let fpsFrames = 0;
        let fpsLastUpdate = performance.now();

        function updateFps(now) {
            fpsFrames += 1;

            if (now - fpsLastUpdate >= 500) {
                const fps = Math.min(999, Math.round((fpsFrames * 1000) / (now - fpsLastUpdate)));
                fpsValue.textContent = String(fps);
                fpsValue.style.color = fps < 30 ? "var(--danger)" : fps < 50 ? "#ffd166" : "var(--success)";
                fpsFrames = 0;
                fpsLastUpdate = now;
            }
        }

        function render() {
            const date = getCurrentDate();
            const second = getZonedParts(date, getTimeZone()).second;

            updateMainHands(date);
            updateFps(performance.now());

            if (second !== state.lastSecond) {
                state.lastSecond = second;
                updateMainTimeZone(date);

                if (comparePanel.classList.contains("is-open")) {
                    renderComparison(date);
                }
            }

            window.requestAnimationFrame(render);
        }

        buildDial();
        initializeTimeZones();
        initializeEffects();

        compareOpenButton.addEventListener("click", openComparison);
        compareAddButton.addEventListener("click", addComparisonLocation);

        updateMainTimeZone(getCurrentDate());

        synchronizeTime().finally(() => {
            state.lastSecond = -1;
        });

        render();

        let lastVisibilitySync = 0;

        document.addEventListener("visibilitychange", () => {
            if (document.visibilityState !== "visible") return;

            const now = performance.now();
            if (now - lastVisibilitySync < 60000) return;

            lastVisibilitySync = now;
            synchronizeTime();
        });

    </script>
</body>
</html>
